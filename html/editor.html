<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Coding Master</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css/editor.css">
</head>
<body>
  <div class="workbench">
    <header class="titlebar">
      <div class="brand"><img src="assets/logo.png" alt=""><span>Coding Master</span></div>
      <button class="command" id="commandBtn" type="button">⌘K <span>Search files and commands...</span></button>
      <div class="top-actions">
        <button id="welcomeBtn" type="button" title="Welcome">?</button>
        <button id="previewToggle" type="button" title="Preview">◫</button>
      </div>
    </header>

    <div class="work-area">
      <aside class="activity-bar">
        <button class="activity active" data-view="explorer" type="button" title="Explorer">▤</button>
        <button class="activity" data-view="search" type="button" title="Search">⌕</button>
        <button class="activity" data-view="source" type="button" title="Source Control">⑂</button>
        <button class="activity" data-view="run" type="button" title="Run">▷</button>
        <div class="activity-spacer"></div>
        <button class="activity" id="settingsBtn" type="button" title="Settings">⚙</button>
      </aside>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span id="sideTitle">EXPLORER</span>
          <div class="sidebar-actions">
            <button id="newFileBtn" type="button" title="New File">＋</button>
            <button id="openFileBtn" type="button" title="Open File">↗</button>
          </div>
        </div>
        <input id="filePicker" type="file" multiple hidden accept=".html,.htm,.css,.js,.json,.md,.txt,.xml,.svg,.ts,.tsx,.jsx">
        <input id="folderPicker" type="file" webkitdirectory directory multiple hidden>
        <div id="sideContent"></div>
        <div class="sidebar-note"><b>Project</b><span>Drop files here or open them from your computer.</span></div>
      </aside>

      <main class="main-editor">
        <div class="tabs" id="tabs"></div>
        <div class="center">
          <section class="code-area">
            <div class="editor-toolbar">
              <span id="breadcrumb"></span>
              <div class="toolbar-actions">
                <button id="saveBtn" type="button">Save</button>
                <button id="runBtn" class="run" type="button">▶ Run</button>
              </div>
            </div>
            <div class="editor-grid">
              <pre id="lineNumbers" class="line-numbers">1</pre>
              <textarea id="codeEditor" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="محرر الأكواد"></textarea>
            </div>
          </section>
          <section class="preview" id="previewPane">
            <div class="preview-head"><div><b>Preview</b><small>PREVIEW</small></div><button id="refreshBtn" type="button">↻</button></div>
            <iframe id="preview" title="معاينة Project"></iframe>
          </section>
        </div>
        <section class="panel">
          <div class="panel-head"><div class="panel-tabs">
            <button class="panel-tab active" data-panel="terminal" type="button">TERMINAL</button>
            <button class="panel-tab" data-panel="problems" type="button">PROBLEMS <span id="problemCount">0</span></button>
            <button class="panel-tab" data-panel="output" type="button">OUTPUT</button>
          </div></div>
          <div class="panel-body" id="panelBody"><div>$ <span>coding-master</span></div><p>Ready.</p></div>
        </section>
      </main>
    </div>
    <footer class="statusbar"><span>main</span><span id="status">Ln 1, Col 1 • HTML • UTF-8</span></footer>
  </div>
  <script src="editor.js"></script>
</body>
</html>
