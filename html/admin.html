<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coding Master - لوحة التحكم</title>

    <link rel="icon" href="../assets/logo.png" type="image/png">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Tajawal", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(255, 255, 255, 0.06), transparent 30%),
                linear-gradient(135deg, #050505, #101010 55%, #181818);
            color: #ffffff;
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           شاشة تسجيل الدخول
        ========================= */

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-card {
            width: min(460px, 100%);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
        }

        .login-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            display: block;
            margin: 0 auto 18px;
            border-radius: 18px;
        }

        .login-card h1 {
            margin: 0;
            text-align: center;
            font-size: 28px;
            font-weight: 900;
        }

        .login-card p {
            margin: 10px 0 28px;
            text-align: center;
            color: #a9a9a9;
            line-height: 1.8;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #d7d7d7;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            border: 1px solid #2c2c2c;
            outline: none;
            background: #0d0d0d;
            color: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 16px;
            transition: 0.2s;
        }

        .field input:focus {
            border-color: #777777;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        .login-button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px;
            background: #ffffff;
            color: #090909;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            transform: translateY(-1px);
            background: #e8e8e8;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-message {
            margin-top: 15px;
            display: none;
            padding: 12px 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            line-height: 1.6;
        }

        .login-message.error {
            display: block;
            color: #ff8d8d;
            background: rgba(255, 60, 60, 0.08);
            border: 1px solid rgba(255, 60, 60, 0.22);
        }

        /* =========================
           لوحة التحكم
        ========================= */

        .dashboard {
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 18px 24px;
            background: rgba(5, 5, 5, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 11px;
        }

        .brand-text h2 {
            margin: 0;
            font-size: 20px;
        }

        .brand-text span {
            color: #9c9c9c;
            font-size: 13px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sound-button,
        .logout-button {
            border: 1px solid #2d2d2d;
            background: #111111;
            color: #ffffff;
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .sound-button:hover,
        .logout-button:hover {
            background: #1b1b1b;
        }

        .main-content {
            width: min(1150px, 100%);
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 900;
        }

        .page-heading p {
            margin: 0;
            color: #999999;
            line-height: 1.8;
        }

        .status-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .status-card {
            flex: 1 1 200px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 16px;
        }

        .status-card .label {
            color: #8f8f8f;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .status-card .value {
            font-size: 22px;
            font-weight: 900;
        }

        .connection {
            color: #7ef0b5;
        }

        .messages-container {
            display: grid;
            gap: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 55px 20px;
            color: #8d8d8d;
            background: rgba(255, 255, 255, 0.025);
            border: 1px dashed #303030;
            border-radius: 20px;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            animation: messageIn 0.25s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        .sender-name {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 900;
        }

        .sender-email {
            margin: 0;
            color: #a5a5a5;
            word-break: break-word;
        }

        .message-date {
            color: #838383;
            font-size: 13px;
            white-space: nowrap;
        }

        .message-info {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .info-box {
            background: #0d0d0d;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 12px;
        }

        .info-box .title {
            color: #737373;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .info-box .content {
            color: #eeeeee;
            word-break: break-word;
        }

        .message-text {
            background: #0b0b0b;
            border: 1px solid #262626;
            border-radius: 14px;
            padding: 15px;
            color: #dddddd;
            line-height: 1.9;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .new-message {
            border-color: rgba(255, 255, 255, 0.25);
        }

        @media (max-width: 650px) {

            .topbar {
                padding: 14px;
            }

            .topbar-actions {
                gap: 6px;
            }

            .sound-button,
            .logout-button {
                padding: 9px 10px;
                font-size: 13px;
            }

            .message-header {
                flex-direction: column;
                gap: 8px;
            }

            .message-info {
                grid-template-columns: 1fr;
            }

            .brand-text span {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         تسجيل الدخول
    ========================= -->

    <section id="loginPage" class="login-page">

        <div class="login-card">

            <img src="../assets/logo.png" alt="Coding Master" class="login-logo">

            <h1>لوحة تحكم Coding Master</h1>

            <p>
                سجّل الدخول بحساب العمل لمشاهدة رسائل تواصل معنا.
            </p>

            <form id="loginForm">

                <div class="field">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input id="email" type="email" autocomplete="username" required placeholder="أدخل بريد حساب العمل">

                </div>


                <div class="field">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input id="password" type="password" autocomplete="current-password" required
                        placeholder="أدخل كلمة المرور">

                </div>


                <button type="submit" class="login-button" id="loginButton">
                    تسجيل الدخول
                </button>

                <div id="loginMessage" class="login-message"></div>

            </form>

        </div>

    </section>


    <!-- =========================
         لوحة التحكم
    ========================= -->

    <section id="dashboard" class="dashboard hidden">

        <header class="topbar">

            <div class="brand">

                <img src="../assets/logo.png" alt="Coding Master">

                <div class="brand-text">

                    <h2>Coding Master</h2>

                    <span>
                        لوحة إدارة رسائل التواصل
                    </span>

                </div>

            </div>


            <div class="topbar-actions">

                <button type="button" class="sound-button" id="soundButton">
                    🔔 تفعيل الصوت
                </button>

                <button type="button" class="logout-button" id="logoutButton">
                    تسجيل الخروج
                </button>

            </div>

        </header>


        <main class="main-content">

            <div class="page-heading">

                <h1>
                    رسائل تواصل معنا
                </h1>

                <p>
                    هنا تظهر رسائل الزوار الجديدة والمحفوظة في قاعدة البيانات.
                </p>

            </div>


            <div class="status-row">

                <div class="status-card">

                    <div class="label">
                        حالة الاتصال
                    </div>

                    <div class="value connection" id="connectionStatus">
                        متصل
                    </div>

                </div>


                <div class="status-card">

                    <div class="label">
                        عدد الرسائل
                    </div>

                    <div class="value" id="messageCount">
                        0
                    </div>

                </div>

            </div>


            <div id="messagesContainer" class="messages-container">

                <div class="empty-state">
                    لا توجد رسائل حتى الآن
                </div>

            </div>

        </main>

    </section>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =========================================
           بيانات Supabase
           ========================================= */

        const SUPABASE_URL =
            "https://wkoyeiydytlgtoknypkd.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_r3BxLBSCV85_7qR6WvYBdw_Bf9qCZe0";


        /* =========================================
           إنشاء اتصال Supabase
           ========================================= */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================================
           عناصر الصفحة
           ========================================= */

        const loginPage =
            document.getElementById("loginPage");

        const dashboard =
            document.getElementById("dashboard");

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const loginMessage =
            document.getElementById("loginMessage");

        const logoutButton =
            document.getElementById("logoutButton");

        const soundButton =
            document.getElementById("soundButton");

        const messagesContainer =
            document.getElementById("messagesContainer");

        const messageCount =
            document.getElementById("messageCount");

        const connectionStatus =
            document.getElementById("connectionStatus");


        let messages = [];
        let soundEnabled = false;
        let realtimeChannel = null;


        /* =========================================
           أدوات مساعدة
           ========================================= */

        function escapeHTML(value) {

            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }


        function formatDate(dateString) {

            const date =
                new Date(dateString);

            return date.toLocaleString(
                "ar-SA",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

        }


        /* =========================================
           صوت الإشعار
           ========================================= */

        const notificationSound =
            new Audio(
                "https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3"
            );


        async function enableSound() {

            try {

                await notificationSound.play();

                notificationSound.pause();

                notificationSound.currentTime = 0;

                soundEnabled = true;

                soundButton.textContent =
                    "🔔 الصوت مفعّل";

            } catch (error) {

                soundEnabled = false;

                soundButton.textContent =
                    "🔔 اضغط لتفعيل الصوت";

            }

        }


        soundButton.addEventListener(
            "click",
            enableSound
        );


        /* =========================================
           إشعار المتصفح
           ========================================= */

        async function requestNotifications() {

            if (!("Notification" in window)) {
                return;
            }

            if (Notification.permission === "default") {

                try {

                    await Notification.requestPermission();

                } catch (error) {

                    console.log(error);

                }

            }

        }


        /* =========================================
           إظهار رسالة المتصفح
           ========================================= */

        function showBrowserNotification(data) {

            if (
                !("Notification" in window) ||
                Notification.permission !== "granted"
            ) {
                return;
            }


            const title =
                `رسالة جديدة من ${data.name}`;


            const body =
                data.message;


            try {

                new Notification(
                    title,
                    {
                        body: body,
                        icon: "../assets/logo.png"
                    }
                );

            } catch (error) {

                console.log(error);

            }

        }


        /* =========================================
           عرض الرسائل
           ========================================= */

        function renderMessages() {

            messageCount.textContent =
                messages.length;


            if (messages.length === 0) {

                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        لا توجد رسائل حتى الآن
                    </div>
                `;

                return;

            }


            messagesContainer.innerHTML =
                messages.map(message => {

                    return `
                        <article class="message-card">

                            <div class="message-header">

                                <div>

                                    <h3 class="sender-name">
                                        ${escapeHTML(message.name)}
                                    </h3>

                                    <p class="sender-email">
                                        ${escapeHTML(message.email)}
                                    </p>

                                </div>

                                <div class="message-date">
                                    ${formatDate(message.created_at)}
                                </div>

                            </div>


                            <div class="message-info">

                                <div class="info-box">

                                    <div class="title">
                                        رقم الهاتف
                                    </div>

                                    <div class="content">
                                        ${escapeHTML(message.phone || "غير متوفر")}
                                    </div>

                                </div>


                                <div class="info-box">

                                    <div class="title">
                                        البريد الإلكتروني
                                    </div>

                                    <div class="content">
                                        ${escapeHTML(message.email)}
                                    </div>

                                </div>

                            </div>


                            <div class="message-text">
                                ${escapeHTML(message.message)}
                            </div>

                        </article>
                    `;

                }).join("");

        }


        /* =========================================
           تحميل الرسائل القديمة
        ========================================= */

        async function loadMessages() {

            connectionStatus.textContent =
                "جاري التحميل...";

            connectionStatus.style.color =
                "#dddddd";


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("messages")
                    .select("*")
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    "خطأ في تحميل الرسائل:",
                    error
                );

                connectionStatus.textContent =
                    "خطأ";

                connectionStatus.style.color =
                    "#ff8d8d";

                return;

            }


            messages = data || [];

            renderMessages();


            connectionStatus.textContent =
                "متصل";

            connectionStatus.style.color =
                "#7ef0b5";

        }


        /* =========================================
           رسالة جديدة
        ========================================= */

        function addNewMessage(newMessage) {

            const alreadyExists =
                messages.some(
                    message =>
                        message.id === newMessage.id
                );


            if (alreadyExists) {
                return;
            }


            messages.unshift(
                newMessage
            );


            renderMessages();


            /*
             * الصوت
             */

            if (soundEnabled) {

                notificationSound.currentTime = 0;

                notificationSound
                    .play()
                    .catch(() => { });

            }


            /*
             * إشعار المتصفح
             */

            showBrowserNotification(
                newMessage
            );


            /*
             * اهتزاز الهاتف إذا كان متاحًا
             */

            if (
                "vibrate" in navigator
            ) {

                navigator.vibrate(
                    [200, 100, 200]
                );

            }

        }


        /* =========================================
           تشغيل Realtime
        ========================================= */

        function startRealtime() {

            if (realtimeChannel) {

                supabaseClient.removeChannel(
                    realtimeChannel
                );

            }


            realtimeChannel =
                supabaseClient
                    .channel("coding-master-messages")
                    .on(
                        "postgres_changes",
                        {
                            event: "INSERT",
                            schema: "public",
                            table: "messages"
                        },
                        payload => {

                            addNewMessage(
                                payload.new
                            );

                        }
                    )
                    .subscribe(
                        status => {

                            console.log(
                                "Realtime:",
                                status
                            );

                        }
                    );

        }


        /* =========================================
           تسجيل الدخول
        ========================================= */

        loginForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                loginMessage.style.display =
                    "none";


                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "جاري تسجيل الدخول...";


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword(
                            {
                                email,
                                password
                            }
                        );


                if (error) {

                    console.error(
                        error
                    );


                    loginMessage.textContent =
                        "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

                    loginMessage.className =
                        "login-message error";

                    loginMessage.style.display =
                        "block";


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "تسجيل الدخول";


                    return;

                }


                if (!data.session) {

                    loginMessage.textContent =
                        "لم يتم إنشاء جلسة دخول.";

                    loginMessage.className =
                        "login-message error";

                    loginMessage.style.display =
                        "block";


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "تسجيل الدخول";


                    return;

                }


                loginPage.classList.add(
                    "hidden"
                );


                dashboard.classList.remove(
                    "hidden"
                );


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "تسجيل الدخول";


                await requestNotifications();


                await loadMessages();


                startRealtime();

            }
        );


        /* =========================================
           تسجيل الخروج
        ========================================= */

        logoutButton.addEventListener(
            "click",
            async () => {

                if (realtimeChannel) {

                    await supabaseClient
                        .removeChannel(
                            realtimeChannel
                        );

                    realtimeChannel =
                        null;

                }


                await supabaseClient.auth
                    .signOut();


                dashboard.classList.add(
                    "hidden"
                );


                loginPage.classList.remove(
                    "hidden"
                );


                loginForm.reset();

            }
        );


        /* =========================================
           التأكد من الجلسة عند فتح الصفحة
        ========================================= */

        async function checkSession() {

            const {
                data
            } =
                await supabaseClient.auth
                    .getSession();


            if (
                data &&
                data.session
            ) {

                loginPage.classList.add(
                    "hidden"
                );


                dashboard.classList.remove(
                    "hidden"
                );


                await requestNotifications();


                await loadMessages();


                startRealtime();

            }

        }


        checkSession();

    </script>

</body>

</html>
