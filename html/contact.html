            padding: 15px;
            border-radius: 12px;

            color: #a1a6b0;
            font-size: 1.2rem;

            right: auto;

            right: 15px;
            left: auto;
        }

    <script>

        /* =========================

        const SUPABASE_URL =

            "أدخل بريدك الإلكتروني...":

            "أدخل رقم هاتفك هنا...":
                "Enter your phone number...",

            "اكتب رسالتك هنا...":
                "Write your message here...",

            "أدخل رمز التحقق الذي وصلك على الإيميل...":
                "Enter the verification code sent to your email...",

            "جاري التحقق...":
                "Verifying...",

            "جاري التحقق من الحساب...":
                "Verifying account...",

            "جاري إرسال الرسالة...":
                "Sending message...",

            "جاري التحقق من الرمز...":
                "Verifying code...",

                "✓ A verification code has been sent to your email.",

            "✓ تم التحقق من بريدك وإرسال رسالتك بنجاح!":
                "✓ Your email was verified and your message was sent successfully!",

            "✕ الإيميل أو رمز الحساب غير صحيح.":

            "✕ تعذر إرسال رمز التحقق. حاول مرة أخرى.":
                "✕ We could not send the verification code. Please try again.",

            "✕ أدخل رمز التحقق أولًا.":
                "✕ Enter the verification code first.",

            "✕ رمز التحقق يجب أن يتكون من 6 أرقام.":
                "✕ The verification code must contain 6 digits.",

            "✕ انتهت جلسة التحقق. أعد المحاولة.":
                "✕ The verification session expired. Please try again.",

            "✕ رمز التحقق غير صحيح.":
                "✕ The verification code is incorrect.",

            "✕ تعذر إرسال الرسالة بعد التحقق.":
                "✕ The message could not be sent after verification.",

            "✕ حدث خطأ أثناء التحقق أو إرسال الرسالة.":
                "✕ An error occurred while verifying or sending the message.",

            "✕ يرجى تعبئة جميع البيانات.":
                "✕ Please fill in all fields.",

            "✕ حدث خطأ. حاول مرة أخرى.":
                "✕ An error occurred. Please try again."

        };


        const reverseTranslationDict = {};

        Object.keys(translationDict)
            .forEach(ar => {

                reverseTranslationDict[
                    translationDict[ar]
                ] = ar;

            });


        const originalTexts =
            new WeakMap();


        function normalizeText(text) {

            return text
                .replace(/\s+/g, " ")
                .trim();

        }


        function saveOriginalTextNodes(node) {

            if (
                node.nodeType === Node.TEXT_NODE
            ) {

                if (
                    node.nodeValue.trim()
                ) {

                    originalTexts.set(
                        node,
                        node.nodeValue
                    );

                }

                return;

            }


            node.childNodes.forEach(
                child => {

                    saveOriginalTextNodes(
                        child
                    );

                }
            );

        }


        function translateTextNodes(lang) {

            const walker =
                document.createTreeWalker(
                    document.body,
                    NodeFilter.SHOW_TEXT
                );

            let node;

            while (
                node = walker.nextNode()
            ) {

                const original =
                    originalTexts.get(node);

                if (!original) {
                    continue;
                }

                const normalized =
                    normalizeText(original);

                let translated = null;


                if (
                    lang === "en" &&
                    translationDict[normalized]
                ) {

                    translated =
                        translationDict[normalized];

                }

                else if (
                    lang === "ar" &&
                    reverseTranslationDict[normalized]
                ) {

                    translated =
                        reverseTranslationDict[normalized];

                }


                if (
                    translated !== null
                ) {

                    const leading =
                        original.match(/^\s*/)?.[0] || "";

                    const trailing =
                        original.match(/\s*$/)?.[0] || "";


                    node.nodeValue =
                        leading +
                        translated +
                        trailing;

                }

            }

        }


        function translateInputs(lang) {

            document
                .querySelectorAll(
                    "input, textarea"
                )
                .forEach(input => {

                    const original =
                        input.getAttribute(
                            "data-cm-original-placeholder"
                        ) ||
                        input.placeholder;


                    if (
                        !input.hasAttribute(
                            "data-cm-original-placeholder"
                        )
                    ) {

                        input.setAttribute(
                            "data-cm-original-placeholder",
                            original
                        );

                    }


                    const normalized =
                        normalizeText(
                            original
                        );


                    if (
                        lang === "en" &&
                        translationDict[normalized]
                    ) {

                        input.placeholder =
                            translationDict[normalized];

                    }

                    else if (
                        lang === "ar"
                    ) {

                        input.placeholder =
                            original;

                    }

                });

        }


        function applyLanguage(lang) {

            document.documentElement.setAttribute(
                "lang",
                lang
            );


            document.documentElement.setAttribute(
                "dir",
                lang === "ar"
                    ? "rtl"
                    : "ltr"
            );


            document
                .querySelectorAll(
                    ".lang-text, #btnLangText"
                )
                .forEach(button => {

                    button.textContent =
                        lang === "ar"
                            ? "English"
                            : "العربية";

                });


            translateTextNodes(
                lang
            );


            translateInputs(
                lang
            );


            document.title =
                lang === "ar"
                    ? "Coding Master - تواصل معنا"
                    : "Coding Master - Contact Us";


            localStorage.setItem(
                "CMLang",
                lang
            );

        }


        function toggleLanguage() {

            const currentLang =
                localStorage.getItem(
                    "CMLang"
                ) || "ar";


            const newLang =
                currentLang === "ar"
                    ? "en"
                    : "ar";


            applyLanguage(
                newLang
            );

        }


        /* =========================
           Password Visibility
        ========================== */

        function toggleCodeVisibility() {

            const input =
                document.getElementById(
                    "accountCodeInput"
                );

            const icon =
                document.getElementById(
                    "toggleCodeBtn"
                );


            if (
                input.type === "password"
            ) {

                input.type = "text";

                icon.classList.remove(
                    "fa-eye"
                );

                icon.classList.add(
                    "fa-eye-slash"
                );

            }

            else {

                input.type =
                    "password";

                icon.classList.remove(
                    "fa-eye-slash"
                );

                icon.classList.add(
                    "fa-eye"
                );

            }

        }


        /* =========================
           Send Message
        ========================== */

        async function sendEmail(event) {

            event.preventDefault();


            const form =
                event.target;


            const btn =
                document.getElementById(
                    "btnSubmit"
                );


            const responseDiv =
                document.getElementById(
                    "formResponse"
                );


            const otpBox =
                document.getElementById(
                    "otpBox"
                );


            const currentLang =
                localStorage.getItem(
                    "CMLang"
                ) || "ar";


            const formData =
                new FormData(form);


            const name =
                String(
                    formData.get("name") || ""
                ).trim();


            const email =
                String(
                    formData.get("email") || ""
                ).trim();


            const accountCode =
                String(
                    formData.get("account_code") || ""
                );


            const phone =
                String(
                    formData.get("phone") || ""
                ).trim();


            const message =
                String(
                    formData.get("message") || ""
                ).trim();


            /* =========================
               التحقق من البيانات
            ========================== */

            if (
                !name ||
                !email ||
                !accountCode ||
                !phone ||
                !message
            ) {

                responseDiv.className =
                    "form-response error";


                responseDiv.textContent =
                    currentLang === "ar"

                        ? "✕ يرجى تعبئة جميع البيانات."

                        : "✕ Please fill in all fields.";


                responseDiv.style.display =
                    "block";


                return;

            }


            btn.disabled =
                true;


            btn.textContent =
                currentLang === "ar"

                    ? "جاري التحقق من الحساب..."

                    : "Verifying account...";


            responseDiv.style.display =
                "none";


            try {

                /* =========================
                   1. التحقق من الإيميل
                      ورمز الحساب
                ========================== */

                const {
                    data: authData,
                    error: authError
                } =
                    await supabaseClient.auth
                        .signInWithPassword({

                            email:
                                email,

                            password:
                                accountCode

                        });


                if (
                    authError ||
                    !authData ||
                    !authData.user
                ) {

                    throw new Error(
                        "INVALID_ACCOUNT"
                    );

                }


                /* =========================
                   تسجيل الخروج المؤقت
                ========================== */

                await supabaseClient.auth.signOut();


                /* =========================
                   2. حفظ بيانات الرسالة
                ========================== */

                pendingContactData = {

                    name:
                        name,

                    email:
                        email,

                    phone:
                        phone,

                    message:
                        message

                };


                /* =========================
                   3. إرسال OTP
                ========================== */

                const {
                    error: otpError
                } =
                    await supabaseClient.auth
                        .signInWithOtp({

                            email:
                                email,

                            options: {

                                shouldCreateUser:
                                    false

                            }

                        });


                if (
                    otpError
                ) {

                    console.error(
                        "OTP Error:",
                        otpError
                    );


                    pendingContactData =
                        null;


                    throw new Error(
                        "OTP_FAILED"
                    );

                }


                /* =========================
                   4. إظهار OTP
                ========================== */

                otpBox.style.display =
                    "block";


                responseDiv.className =
                    "form-response success";


                responseDiv.textContent =
                    currentLang === "ar"

                        ? "✓ تم إرسال رمز التحقق إلى بريدك الإلكتروني."

                        : "✓ A verification code has been sent to your email.";


                responseDiv.style.display =
                    "block";


                btn.style.display =
                    "none";


                document
                    .getElementById(
                        "otpInput"
                    )
                    .focus();

            }

            catch (error) {

                console.error(
                    "Contact Error:",
                    error
                );


                responseDiv.className =
                    "form-response error";


                if (
                    error.message ===
                    "INVALID_ACCOUNT"
                ) {

                    responseDiv.textContent =
                        currentLang === "ar"

                            ? "✕ الإيميل أو رمز الحساب غير صحيح."

                            : "✕ The email or account code is incorrect.";

                }

                else if (
                    error.message ===
                    "OTP_FAILED"
                ) {

                    responseDiv.textContent =
                        currentLang === "ar"

                            ? "✕ تعذر إرسال رمز التحقق. حاول مرة أخرى."

                            : "✕ We could not send the verification code. Please try again.";

                }

                else {

                    responseDiv.textContent =
                        currentLang === "ar"

                            ? "✕ حدث خطأ. حاول مرة أخرى."

                            : "✕ An error occurred. Please try again.";

                }


                responseDiv.style.display =
                    "block";

            }

            finally {

                btn.disabled =
                    false;

            }

        }


        /* =========================
           Verify Email OTP
        ========================== */

        async function verifyEmailOtp() {

            const otpInput =
                document.getElementById(
                    "otpInput"
                );


            const otpBtn =
                document.getElementById(
                    "verifyOtpBtn"
                );


            const responseDiv =
                document.getElementById(
                    "formResponse"
                );


            const currentLang =
                localStorage.getItem(
                    "CMLang"
                ) || "ar";


            const token =
                String(
                    otpInput.value || ""
                ).trim();


            /* =========================
               التحقق من وجود الرمز
            ========================== */

            if (
                !token
            ) {

                responseDiv.className =
                    "form-response error";


                responseDiv.textContent =
                    currentLang === "ar"

                        ? "✕ أدخل رمز التحقق أولًا."

                        : "✕ Enter the verification code first.";


                responseDiv.style.display =
                    "block";


                return;

            }


            /* =========================
               OTP يجب أن يكون 6 أرقام
            ========================== */

            if (
                !/^\d{6}$/.test(token)
            ) {

                responseDiv.className =
                    "form-response error";


                responseDiv.textContent =
                    currentLang === "ar"

                        ? "✕ رمز التحقق يجب أن يتكون من 6 أرقام."

                        : "✕ The verification code must contain 6 digits.";


                responseDiv.style.display =
                    "block";


                return;

            }


            /* =========================
               التأكد من وجود البيانات
            ========================== */

            if (
                !pendingContactData
            ) {

                responseDiv.className =
                    "form-response error";


                responseDiv.textContent =
                    currentLang === "ar"

                        ? "✕ انتهت جلسة التحقق. أعد المحاولة."

                        : "✕ The verification session expired. Please try again.";


                responseDiv.style.display =
                    "block";


                return;

            }


            otpBtn.disabled =
                true;


            otpBtn.textContent =
                currentLang === "ar"

                    ? "جاري التحقق من الرمز..."

                    : "Verifying code...";


            try {

                /* =========================
                   1. التحقق من OTP
                ========================== */

                const {
                    data: verifyData,
                    error: verifyError
                } =
                    await supabaseClient.auth
                        .verifyOtp({

                            email:
                                pendingContactData.email,

                            token:
                                token,

                            type:
                                "email"

                        });


                if (
                    verifyError ||
                    !verifyData ||
                    !verifyData.user
                ) {

                    throw new Error(
                        "INVALID_OTP"
                    );

                }


                /* =========================
                   2. إرسال الرسالة
                ========================== */

                const {
                    error: insertError
                } =
                    await supabaseClient
                        .from("messages")
                        .insert({

                            name:
                                pendingContactData.name,

                            email:
                                pendingContactData.email,

                            phone:
                                pendingContactData.phone,

                            message:
                                pendingContactData.message

                        });


                if (
                    insertError
                ) {

                    console.error(
                        "Insert Error:",
                        insertError
                    );


                    throw new Error(
                        "SEND_FAILED"
                    );

                }


                /* =========================
                   3. النجاح
                ========================== */

                responseDiv.className =
                    "form-response success";


                responseDiv.textContent =
                    currentLang === "ar"

                        ? "✓ تم التحقق من بريدك وإرسال رسالتك بنجاح!"

                        : "✓ Your email was verified and your message was sent successfully!";


                responseDiv.style.display =
                    "block";


                formReset();


                pendingContactData =
                    null;


                try {

                    await supabaseClient.auth.signOut();

                }

                catch (
                signOutError
                ) {

                    console.warn(
                        "Sign out warning:",
                        signOutError
                    );

                }


                const successSound =
                    new Audio(
                        "https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3"
                    );


                successSound
                    .play()
                    .catch(
                        () => { }
                    );

            }

            catch (error) {

                console.error(
                    "OTP Verification Error:",
                    error
                );


                responseDiv.className =
                    "form-response error";


                if (
                    error.message ===
                    "INVALID_OTP"
                ) {

                    responseDiv.textContent =
                        currentLang === "ar"

                            ? "✕ رمز التحقق غير صحيح."

                            : "✕ The verification code is incorrect.";

                }

                else if (
                    error.message ===
                    "SEND_FAILED"
                ) {

                    responseDiv.textContent =
                        currentLang === "ar"

                            ? "✕ تم التحقق من الإيميل، لكن تعذر إرسال الرسالة."

                            : "✕ Your email was verified, but the message could not be sent.";

                }

                else {

                    responseDiv.textContent =
                        currentLang === "ar"

                            ? "✕ حدث خطأ أثناء التحقق أو إرسال الرسالة."

                            : "✕ An error occurred while verifying or sending the message.";

                }


                responseDiv.style.display =
                    "block";


                const errorSound =
                    new Audio(
                        "https://assets.mixkit.co/sfx/preview/mixkit-software-interface-back-2575.mp3"
                    );


                errorSound
                    .play()
                    .catch(
                        () => { }
                    );

            }

            finally {

                otpBtn.disabled =
                    false;


                otpBtn.textContent =
                    currentLang === "ar"

                        ? "تحقق من الرمز"

                        : "Verify Code";

            }

        }


        /* =========================
           Reset Form
        ========================== */

        function formReset() {

            const form =
                document.querySelector(
                    ".contact-form"
                );


            form.reset();


            document
                .getElementById(
                    "otpInput"
                )
                .value =
                "";


            document
                .getElementById(
                    "otpBox"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "btnSubmit"
                )
                .style.display =
                "";


            document
                .getElementById(
                    "accountCodeInput"
                )
                .type =
                "password";


            const toggleIcon =
                document.getElementById(
                    "toggleCodeBtn"
                );


            toggleIcon.classList.remove(
                "fa-eye-slash"
            );


            toggleIcon.classList.add(
                "fa-eye"
            );

        }


        /* =========================
           Page Loaded
        ========================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                saveOriginalTextNodes(
                    document.body
                );


                const savedLang =
                    localStorage.getItem(
                        "CMLang"
                    ) || "ar";


                if (
                    savedLang === "en"
                ) {

                    applyLanguage(
                        "en"
                    );

                }

            }
        );


        /* =========================
           Service Worker
        ========================== */

        if (
            "serviceWorker" in navigator
        ) {

            navigator.serviceWorker
                .register(
                    "/service-worker.js"
                )
                .then(
                    registration => {

                        console.log(
                            "Coding Master Service Worker جاهز ✅",
                            registration
                        );

                    }
                )
                .catch(
                    error => {

                        console.error(
                            "Service Worker Error:",
                            error
                        );

                    }
                );

        }

    </script>

</body>

</html>
