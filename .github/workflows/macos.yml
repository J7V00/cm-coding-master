name: Publish macOS App

on:
  push:
    branches:
      - main
    paths-ignore:
      - "downloads/Coding-Master-macOS.dmg"

permissions:
  contents: write

jobs:
  publish-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build macOS Universal DMG
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles dmg --target universal-apple-darwin

      - name: Replace macOS download file
        shell: bash
        run: |
          set -e
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          if [ -z "$DMG" ]; then
            echo "macOS DMG was not found."
            exit 1
          fi
          cp "$DMG" "downloads/Coding-Master-macOS.dmg"

      - name: Commit macOS installer
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Coding-Master-macOS.dmg
          git commit -m "Publish macOS App [skip ci]" || echo "No changes to commit"
          git push
