name: Publish Windows App

on:
  push:
    paths:
      - ".github/workflows/publish-windows.yml"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis

      - name: Replace Windows download file
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not found."
          }
          Copy-Item $installer.FullName "downloads/Coding-Master-Windows.exe" -Force

      - name: Commit Windows installer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Coding-Master-Windows.exe
          git commit -m "Publish Windows App [skip ci]" || echo "No changes to commit"
          git push
