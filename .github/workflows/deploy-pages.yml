name: Deploy Coding Master to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Coding Master website
        run: |
          mkdir -p _site

          cp -R html/. _site/

          cp -R assets _site/
          cp -R main.css _site/
          cp -R downloads _site/

          cp script.js _site/ 2>/dev/null || true
          cp device.js _site/ 2>/dev/null || true
          cp manifest.json _site/ 2>/dev/null || true
          cp service-worker.js _site/ 2>/dev/null || true

          # Fix paths that differ after the html files are moved to the site root
          sed -i 's#\.\./downloads/#downloads/#g' _site/download.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
